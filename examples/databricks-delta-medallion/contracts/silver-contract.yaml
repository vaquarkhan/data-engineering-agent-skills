dataset_contract:
  name: silver_customer_events
  owner: lakehouse@example.com
  domain: customer
  layer: silver
  description: Contract-aware silver events curated from bronze ingestion before gold serving.
  grain: one row per event_id
  keys:
    business_key:
      - event_id
  schema:
    version: v2
    columns:
      - name: event_id
        type: string
        nullable: false
      - name: customer_id
        type: string
        nullable: false
      - name: event_type
        type: string
        nullable: false
      - name: event_ts
        type: timestamp
        nullable: false
  freshness:
    field: event_ts
    cadence: hourly
    max_age_hours: 24
  quality:
    checks:
      - unique: [event_id]
      - not_null: [event_id, customer_id, event_type, event_ts]
      - row_count_min: 1
  compatibility:
    change_policy: additive_by_default
    deprecation_notice_days: 30
