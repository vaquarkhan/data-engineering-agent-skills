backfill_plan:
  name: replay_orders_publish_window
  owner: data-platform@example.com
  reason: Recover a failed staging validation window before production release.
  affected_window:
    start_utc: "2026-05-01T00:00:00Z"
    end_utc: "2026-05-02T00:00:00Z"
    partitions:
      - "event_date=2026-05-01"
  source_of_truth:
    system: canonical_orders
    dataset: bronze.orders_raw
  targets:
    - silver.orders_clean
    - publish.orders_daily
  execution:
    mode: replay
    idempotent: true
    write_strategy: merge
    dry_run_completed: true
  safeguards:
    publish_paused: true
    downstream_notifications:
      - finance_reporting
    rollback_strategy: Re-close publish and restore the prior snapshot if reconciliation fails.
  validation:
    checks:
      - type: row_count_parity
        threshold_percent: 0.1
      - type: metric_reconciliation
        metric: net_revenue
        threshold_percent: 0.05
  approvals:
    required:
      - data-platform-owner
  status:
    state: draft
