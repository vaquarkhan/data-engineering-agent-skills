source_contract:
  name: example_source
  owner: data-platform@example.com
  system_of_record: example-system
  extraction_method: api
  cadence: hourly
  sla:
    freshness_minutes: 90
    availability_percent: 99.0
  schema:
    version: v1
    primary_key:
      - id
    columns:
      - name: id
        type: string
        required: true
      - name: updated_at
        type: timestamp
        required: true
      - name: status
        type: string
        required: false
  cdc:
    enabled: true
    watermark_column: updated_at
    delete_behavior: tombstone
    late_arrival_minutes: 30
  quality:
    required_checks:
      - not_null:id
      - not_null:updated_at
  security:
    classification: internal
    pii_fields: []
  notes:
    - replace values with project-specific details
