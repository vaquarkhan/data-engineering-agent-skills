name: Agent Benchmarks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  agent-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run benchmark score check
        run: python benchmarks/score_benchmarks.py
